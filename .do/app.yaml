# DigitalOcean App Platform — static site specification.
#
# web/ is committed to the repository already built, so there is no build
# command and nothing runs in the cloud: App Platform simply serves the files.
# That is what makes `git push` the whole deployment process.
#
# Before the first deploy, replace <YOUR-GITHUB-USERNAME> below, then either
# point the App Platform UI at this file or run:
#   doctl apps create --spec .do/app.yaml
name: FlashStore
region: lon

static_sites:
  - name: web
    github:
      repo: <YOUR-GITHUB-USERNAME>/FlashStore
      branch: main
      deploy_on_push: true

    # output_dir is resolved relative to the repository root when no build
    # command runs, so web/ is served as the site root.
    source_dir: /
    output_dir: web

    index_document: index.html
    error_document: 404.html

    # Every page is a real file at a real path (directory-per-page), so no
    # catchall rewrite is needed — a genuine 404 should return a 404.

    routes:
      - path: /
